<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reverse Snake - 2 Player Showdown</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-wrapper">
    <h1>⚔ Reverse Snake: 2-Player Showdown</h1>

    <div class="settings-bar">
      <label for="roundDuration">Round Time:</label>
      <select id="roundDuration">
        <option value="30">30 Seconds</option>
        <option value="60" selected>60 Seconds (1 Min)</option>
        <option value="90">90 Seconds</option>
        <option value="120">120 Seconds (2 Min)</option>
      </select>
      <button id="startBtn">Start Game</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div class="hud">
      <div class="score-card snake-hud">
        <h2>🐍 Snake (Player 1)</h2>
        <p>Controls: <strong>W, A, S, D</strong></p>
        <div class="score-value">Score: <span id="snakeScore">0</span></div>
      </div>

      <div class="timer-card">
        <div class="timer-title">Time Left</div>
        <div id="timerDisplay">60</div>
      </div>

      <div class="score-card fruit-hud">
        <h2>🍎 Fruit (Player 2)</h2>
        <p>Move: <strong>Arrows</strong> | Trap: <strong>Shift / Enter</strong></p>
        <div class="score-value">Score: <span id="fruitScore">0</span></div>
        <div class="charges-value">Traps Available: <span id="trapCharges">0</span></div>
      </div>
    </div>

    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <div id="banner" class="banner"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
